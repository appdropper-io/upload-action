name: "Upload to App Dropper"
description: "Send an .apk or .ipa to App Dropper and get a shareable install link — optionally posted straight to the pull request."
author: "App Dropper"

branding:
  icon: "upload-cloud"
  color: "purple"

inputs:
  file:
    description: "Path to the .apk or .ipa to upload, relative to the workspace."
    required: true
  token:
    # No ${{ }} in this description: GitHub evaluates expressions anywhere in a
    # manifest, including input descriptions, and "secrets" is not a valid context
    # at load time — an example here fails the whole action with
    # "Unrecognized named-value: 'secrets'" before any step runs.
    description: "An App Dropper API token. Store it as a repository secret and pass secrets.APPDROPPER_TOKEN."
    required: true
  release-notes:
    description: "Release notes shown to testers on the install page. Defaults to the head commit message."
    required: false
    default: ""
  tag:
    description: 'Label for the build, e.g. "beta" or "nightly".'
    required: false
    default: ""
  comment-on-pr:
    description: "Post the install link and QR code as a pull-request comment. Ignored outside pull_request events."
    required: false
    default: "true"
  timeout:
    description: "Seconds to wait for the build to finish processing."
    required: false
    default: "600"
  cli-version:
    description: "Version of the appdropper npm package to run."
    required: false
    default: "1"
  api-url:
    description: "Override the API base URL. Only needed for a self-hosted deployment."
    required: false
    default: ""

outputs:
  install-url:
    description: "Public install link for the uploaded build."
    value: ${{ steps.upload.outputs.install-url }}
  build-id:
    description: "Identifier of the build that was created."
    value: ${{ steps.upload.outputs.build-id }}
  qr-url:
    description: "PNG QR code pointing at the install link."
    value: ${{ steps.upload.outputs.qr-url }}

runs:
  # A composite action rather than a bundled JavaScript one: the whole thing is
  # a thin wrapper over the CLI, and shipping it this way means the Action and a
  # hand-written `run: npx appdropper upload` step are the same code path — one
  # place for bugs to be fixed, one place for behaviour to drift.
  using: "composite"
  steps:
    - name: Upload build
      id: upload
      shell: bash
      env:
        APPDROPPER_TOKEN: ${{ inputs.token }}
        APPDROPPER_API_URL: ${{ inputs.api-url }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_NOTES: ${{ inputs.release-notes }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_TIMEOUT: ${{ inputs.timeout }}
        CLI_VERSION: ${{ inputs.cli-version }}
        HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: ${{ github.action_path }}/scripts/upload.sh

    - name: Job summary
      if: success()
      shell: bash
      env:
        INSTALL_URL: ${{ steps.upload.outputs.install-url }}
        QR_URL: ${{ steps.upload.outputs.qr-url }}
      run: ${{ github.action_path }}/scripts/summary.sh

    - name: Comment on the pull request
      # Only on pull requests, and only when the workflow has been given
      # permission to write to issues — a forked-PR run has a read-only token
      # and this step would otherwise fail an otherwise-successful upload.
      if: >-
        success() &&
        inputs.comment-on-pr == 'true' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        INSTALL_URL: ${{ steps.upload.outputs.install-url }}
        QR_URL: ${{ steps.upload.outputs.qr-url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        FILE: ${{ inputs.file }}
      run: ${{ github.action_path }}/scripts/comment.sh
